name: Chore
description: Propose maintenance, tooling, dependency, or repository-workflow changes.
title: "[chore] "
type: task
body:
  - type: markdown
    attributes:
      value: |
        This template assigns the native GitHub Issue Type `Task`. After this issue is created, create the branch with:
        `pnpm branch chore <issue-number> <short-kebab-slug>`
        Before implementation, add the issue to the configured Project and set its `Priority` Field.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this maintenance or workflow change needed?
      placeholder: Describe the reason and expected benefit.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should change, and what is out of scope?
      placeholder: List the expected changes and boundaries.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true when the maintenance work is complete?
      placeholder: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: Which checks or manual verification should be run?
      placeholder: Describe the verification steps.
    validations:
      required: true
