name: Bug fix
description: Report a reproducible defect or incorrect behavior.
title: "[fix] "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        This template assigns the native GitHub Issue Type `Bug`. After this issue is created, create its dedicated worktree with:
        `pnpm branch fix <issue-number> <short-kebab-slug>`
        Before implementation, add the issue to the configured Project and set its `Priority` Field.

  - type: textarea
    id: motivation
    attributes:
      label: Problem
      description: What is wrong, and who is affected?
      placeholder: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What steps reproduce the problem?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What behavior should be restored or corrected?
      placeholder: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: Which regression tests, checks, or manual verification should be run?
      placeholder: Describe the verification steps.
    validations:
      required: true
