name: Branch name

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|docs|chore)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error title=Invalid branch name::${BRANCH_NAME} does not match <type>/<issue-number>-<short-kebab-slug>"
            echo "Expected one of: feat, fix, refactor, docs, chore"
            exit 1
          fi

          echo "Branch name is valid: ${BRANCH_NAME}"

      - name: Validate linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const branchMatch = /^(feat|fix|refactor|docs|chore)\/(\d+)-/.exec(branch);

            if (!branchMatch) {
              core.setFailed(`Could not extract an issue number from branch '${branch}'.`);
              return;
            }

            const [, type, issueNumber] = branchMatch;
            const pullRequest = context.payload.pull_request;
            const titleMatch = /^\[(feat|fix|refactor|docs|chore)\]\s+(.+?)\s+\(#(\d+)\)$/.exec(
              pullRequest.title.trim(),
            );

            if (!titleMatch) {
              core.setFailed(
                "PR title must match '[type] Short summary (#issue-number)', for example '[feat] Add SSO support (#123)'.",
              );
              return;
            }

            const [, titleType, , titleIssueNumber] = titleMatch;

            if (titleType !== type) {
              core.setFailed(
                `PR title type '${titleType}' must match branch type '${type}'.`,
              );
              return;
            }

            if (titleIssueNumber !== issueNumber) {
              core.setFailed(
                `PR title issue number #${titleIssueNumber} must match branch issue #${issueNumber}.`,
              );
              return;
            }

            const text = `${pullRequest.title}\n${pullRequest.body ?? ""}`;
            const closingKeyword = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issueNumber}\\b`,
              "i",
            );

            if (!closingKeyword.test(text)) {
              core.setFailed(
                `PR must include 'Fixes #${issueNumber}' (or an equivalent closing keyword).`,
              );
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(issueNumber),
            });
            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );
            const expectedLabel = `type:${type}`;

            if (!labels.includes(expectedLabel)) {
              core.setFailed(
                `Issue #${issueNumber} must have the '${expectedLabel}' label to match branch '${type}'.`,
              );
              return;
            }

            const pullRequestLabels = pullRequest.labels.map((label) => label.name);
            const pullRequestTypeLabels = pullRequestLabels.filter((label) =>
              label.startsWith("type:"),
            );

            if (
              pullRequestTypeLabels.length !== 1 ||
              pullRequestTypeLabels[0] !== expectedLabel
            ) {
              core.setFailed(
                `PR must have exactly one matching type label: '${expectedLabel}'.`,
              );
              return;
            }

            core.info(
              `PR is linked to Issue #${issueNumber} with the '${expectedLabel}' label on both the Issue and PR.`,
            );
